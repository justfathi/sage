<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAGE Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060412;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  @keyframes breathe  { 0%,100%{opacity:0.82} 50%{opacity:1}    }
  @keyframes rootPulse{ 0%,100%{opacity:0.55} 50%{opacity:0.92}  }
  @keyframes bloom    { 0%,100%{transform:scale(1);   opacity:0.85}
                        50%    {transform:scale(1.14); opacity:1}   }
  @keyframes newGrow  { 0%  {stroke-dashoffset:320;opacity:0.2}
                        100%{stroke-dashoffset:0;  opacity:0.88}   }
  @keyframes soilGlow { 0%,100%{opacity:0.55} 50%{opacity:0.85}   }

  .trunk      { animation: breathe   4.0s ease-in-out infinite; }
  .roots      { animation: rootPulse 5.5s ease-in-out infinite; }
  .soil       { animation: soilGlow  6.0s ease-in-out infinite; }
  .b-analyst  { animation: bloom 3.6s ease-in-out 0.0s infinite; transform-box:fill-box; transform-origin:center; }
  .b-builder  { animation: bloom 3.6s ease-in-out 0.9s infinite; transform-box:fill-box; transform-origin:center; }
  .b-coord    { animation: bloom 3.6s ease-in-out 1.8s infinite; transform-box:fill-box; transform-origin:center; }
  .b-new      { animation: bloom 4.5s ease-in-out 2.5s infinite; transform-box:fill-box; transform-origin:center; }
  .newbranch  { stroke-dasharray: 16 10;
                animation: newGrow 6s ease-in-out infinite alternate; }
</style>
</head>
<body>
<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" width="900" height="580">
<defs>
  <!-- Ground amber aura -->
  <radialGradient id="soilAura" cx="50%" cy="100%" r="60%">
    <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>
  <!-- Sky purple aura from crown -->
  <radialGradient id="crownAura" cx="50%" cy="30%" r="45%">
    <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>

  <!-- Full branch paths used by animateMotion particles -->
  <!-- trunk fork(450,270) → left arm(330,205) → Analyst(182,128) -->
  <path id="pa" d="M 450 270 C 400 250 358 224 330 205 C 306 188 248 158 182 128"/>
  <!-- trunk fork(450,270) → right arm(568,205) → Builder(556,102) -->
  <path id="pb" d="M 450 270 C 500 248 538 222 568 205 C 584 195 576 150 556 102"/>
  <!-- trunk fork(450,270) → right arm(568,205) → Coordinator(716,138) -->
  <path id="pc" d="M 450 270 C 500 248 538 222 568 205 C 596 190 660 162 716 138"/>
  <!-- lower trunk(454,365) → New Role(638,325) -->
  <path id="pn" d="M 454 365 C 508 354 576 338 638 325"/>

  <!-- Glow filters -->
  <filter id="fTrunk" x="-60%" y="-10%" width="220%" height="120%">
    <feGaussianBlur stdDeviation="15" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fBranch" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fBloom" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="13" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fRoot" x="-50%" y="-40%" width="200%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fSoilText">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ═══════════════════════════════════
     BACKGROUND
═══════════════════════════════════ -->
<rect width="900" height="580" fill="#060412"/>
<rect width="900" height="580" fill="url(#soilAura)"/>
<rect width="900" height="580" fill="url(#crownAura)"/>

<!-- ═══════════════════════════════════
     SOIL  (the ask · the goal · the company)
═══════════════════════════════════ -->
<!-- Soil layer -->
<rect x="0" y="448" width="900" height="132" fill="#0e0820" opacity="0.9"/>
<!-- Warm ground glow -->
<ellipse cx="450" cy="448" rx="340" ry="40" fill="#f59e0b" opacity="0.12" class="soil"/>
<!-- Ground line -->
<line x1="60" y1="448" x2="840" y2="448" stroke="#f59e0b" stroke-width="1" opacity="0.28"/>

<!-- ═══════════════════════════════════
     ROOTS  (SAGE embedding into the company)
═══════════════════════════════════ -->
<g filter="url(#fRoot)" class="roots">
  <!-- Left roots -->
  <path d="M 440 448 C 400 456 336 452 258 460 C 198 466 140 462 82 470"
    fill="none" stroke="#92400e" stroke-width="12" stroke-linecap="round"/>
  <path d="M 440 448 C 400 456 336 452 258 460 C 198 466 140 462 82 470"
    fill="none" stroke="#fcd34d" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M 436 450 C 388 462 320 468 256 476 C 202 482 155 480 105 488"
    fill="none" stroke="#92400e" stroke-width="7"  stroke-linecap="round"/>
  <path d="M 436 450 C 388 462 320 468 256 476 C 202 482 155 480 105 488"
    fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <path d="M 434 452 C 390 468 340 476 285 488"
    fill="none" stroke="#92400e" stroke-width="5"  stroke-linecap="round"/>
  <path d="M 434 452 C 390 468 340 476 285 488"
    fill="none" stroke="#fcd34d" stroke-width="2"  stroke-linecap="round" opacity="0.35"/>

  <!-- Right roots -->
  <path d="M 460 448 C 502 456 566 452 644 460 C 706 466 762 462 818 470"
    fill="none" stroke="#92400e" stroke-width="12" stroke-linecap="round"/>
  <path d="M 460 448 C 502 456 566 452 644 460 C 706 466 762 462 818 470"
    fill="none" stroke="#fcd34d" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M 464 450 C 512 462 580 468 644 476 C 700 482 748 480 796 488"
    fill="none" stroke="#92400e" stroke-width="7"  stroke-linecap="round"/>
  <path d="M 464 450 C 512 462 580 468 644 476 C 700 482 748 480 796 488"
    fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <path d="M 466 452 C 510 468 558 476 614 488"
    fill="none" stroke="#92400e" stroke-width="5"  stroke-linecap="round"/>
  <path d="M 466 452 C 510 468 558 476 614 488"
    fill="none" stroke="#fcd34d" stroke-width="2"  stroke-linecap="round" opacity="0.35"/>
</g>

<!-- ═══════════════════════════════════
     TRUNK  (SAGE — the engine)
═══════════════════════════════════ -->
<g filter="url(#fTrunk)" class="trunk">
  <!-- Wide dark body (tapered: wider at base) -->
  <path d="M 450 448 C 447 410 446 368 447 328 C 448 298 449 280 450 270"
    fill="none" stroke="#1e0a4e" stroke-width="50" stroke-linecap="round"/>
  <!-- Mid glow -->
  <path d="M 450 448 C 447 410 446 368 447 328 C 448 298 449 280 450 270"
    fill="none" stroke="#6d28d9" stroke-width="30" stroke-linecap="round"/>
  <!-- Bright inner vein -->
  <path d="M 450 448 C 447 410 446 368 447 328 C 448 298 449 280 450 270"
    fill="none" stroke="#c084fc" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
</g>

<!-- SAGE label carved into trunk -->
<text x="450" y="386" text-anchor="middle"
  font-size="30" font-weight="900" fill="white"
  font-family="Georgia, serif" letter-spacing="7" opacity="0.96">SAGE</text>
<text x="450" y="408" text-anchor="middle"
  font-size="8.5" fill="#ddd6fe" letter-spacing="4" opacity="0.6">THE ENGINE</text>


<!-- ═══════════════════════════════════
     BRANCHES  — drawn level by level so
     shared arms appear first (thicker),
     then sub-branches on top (thinner).
═══════════════════════════════════ -->

<!-- ── LEFT MAIN ARM  (trunk fork → mid-left junction) ── -->
<g filter="url(#fBranch)">
  <path d="M 450 270 C 400 250 358 224 330 205"
    fill="none" stroke="#064e3b" stroke-width="22" stroke-linecap="round"/>
  <path d="M 450 270 C 400 250 358 224 330 205"
    fill="none" stroke="#059669" stroke-width="13" stroke-linecap="round"/>
  <path d="M 450 270 C 400 250 358 224 330 205"
    fill="none" stroke="#34d399" stroke-width="5"  stroke-linecap="round" opacity="0.85"/>
</g>

<!-- ── LEFT SUB-BRANCH → Analyst ── -->
<g filter="url(#fBranch)">
  <path d="M 330 205 C 306 188 248 158 182 128"
    fill="none" stroke="#064e3b" stroke-width="14" stroke-linecap="round"/>
  <path d="M 330 205 C 306 188 248 158 182 128"
    fill="none" stroke="#059669" stroke-width="8"  stroke-linecap="round"/>
  <path d="M 330 205 C 306 188 248 158 182 128"
    fill="none" stroke="#34d399" stroke-width="3"  stroke-linecap="round" opacity="0.85"/>
</g>

<!-- ── RIGHT MAIN ARM  (trunk fork → mid-right junction) ── -->
<g filter="url(#fBranch)">
  <path d="M 450 270 C 500 248 538 222 568 205"
    fill="none" stroke="#1e3a8a" stroke-width="22" stroke-linecap="round"/>
  <path d="M 450 270 C 500 248 538 222 568 205"
    fill="none" stroke="#1d4ed8" stroke-width="13" stroke-linecap="round"/>
  <path d="M 450 270 C 500 248 538 222 568 205"
    fill="none" stroke="#60a5fa" stroke-width="5"  stroke-linecap="round" opacity="0.85"/>
</g>

<!-- ── RIGHT SUB → Builder (upward) ── -->
<g filter="url(#fBranch)">
  <path d="M 568 205 C 576 188 576 150 556 102"
    fill="none" stroke="#1e3a8a" stroke-width="14" stroke-linecap="round"/>
  <path d="M 568 205 C 576 188 576 150 556 102"
    fill="none" stroke="#1d4ed8" stroke-width="8"  stroke-linecap="round"/>
  <path d="M 568 205 C 576 188 576 150 556 102"
    fill="none" stroke="#60a5fa" stroke-width="3"  stroke-linecap="round" opacity="0.85"/>
</g>

<!-- ── RIGHT SUB → Coordinator (rightward) ── -->
<g filter="url(#fBranch)">
  <path d="M 568 205 C 596 190 660 162 716 138"
    fill="none" stroke="#7f1d1d" stroke-width="14" stroke-linecap="round"/>
  <path d="M 568 205 C 596 190 660 162 716 138"
    fill="none" stroke="#dc2626" stroke-width="8"  stroke-linecap="round"/>
  <path d="M 568 205 C 596 190 660 162 716 138"
    fill="none" stroke="#f87171" stroke-width="3"  stroke-linecap="round" opacity="0.85"/>
</g>

<!-- ── LOWER BRANCH → New Role (dashed, forming) ── -->
<g filter="url(#fBranch)">
  <path d="M 454 365 C 508 354 576 338 638 325"
    fill="none" stroke="#78350f" stroke-width="14" stroke-linecap="round"
    class="newbranch"/>
  <path d="M 454 365 C 508 354 576 338 638 325"
    fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round"
    class="newbranch" opacity="0.85"/>
</g>


<!-- ═══════════════════════════════════
     AGENT BLOOMS  (leaves / fruits)
═══════════════════════════════════ -->

<!-- ANALYST bloom -->
<g filter="url(#fBloom)" class="b-analyst">
  <circle cx="182" cy="128" r="30" fill="#059669" opacity="0.88"/>
  <circle cx="182" cy="128" r="17" fill="#6ee7b7"/>
  <ellipse cx="173" cy="117" rx="8" ry="5" fill="white" opacity="0.2"/>
</g>
<text x="182" y="121" text-anchor="middle" font-size="15">🔍</text>
<text x="182" y="177" text-anchor="middle" font-size="12"
  fill="#34d399" font-weight="700" font-family="Georgia,serif">Analyst</text>
<text x="182" y="193" text-anchor="middle" font-size="8.5"
  fill="#6ee7b7" font-style="italic">finds the gaps</text>

<!-- BUILDER bloom -->
<g filter="url(#fBloom)" class="b-builder">
  <circle cx="556" cy="102" r="28" fill="#1d4ed8" opacity="0.88"/>
  <circle cx="556" cy="102" r="16" fill="#93c5fd"/>
  <ellipse cx="547" cy="91"  rx="7" ry="5" fill="white" opacity="0.2"/>
</g>
<text x="556" y="95"  text-anchor="middle" font-size="15">⚙️</text>
<text x="556" y="150" text-anchor="middle" font-size="12"
  fill="#60a5fa" font-weight="700" font-family="Georgia,serif">Builder</text>
<text x="556" y="166" text-anchor="middle" font-size="8.5"
  fill="#93c5fd" font-style="italic">gets things done</text>

<!-- COORDINATOR bloom -->
<g filter="url(#fBloom)" class="b-coord">
  <circle cx="716" cy="138" r="26" fill="#dc2626" opacity="0.88"/>
  <circle cx="716" cy="138" r="15" fill="#fca5a5"/>
  <ellipse cx="707" cy="127" rx="7" ry="4" fill="white" opacity="0.2"/>
</g>
<text x="716" y="131" text-anchor="middle" font-size="14">📋</text>
<text x="716" y="184" text-anchor="middle" font-size="12"
  fill="#f87171" font-weight="700" font-family="Georgia,serif">Coordinator</text>
<text x="716" y="200" text-anchor="middle" font-size="8.5"
  fill="#fca5a5" font-style="italic">keeps order</text>

<!-- NEW ROLE bloom (forming) -->
<g class="b-new">
  <circle cx="638" cy="325" r="32" fill="#92400e" opacity="0.3"  filter="url(#fBloom)"/>
  <circle cx="638" cy="325" r="22" fill="#d97706" opacity="0.72" filter="url(#fBloom)"/>
  <circle cx="638" cy="325" r="12" fill="#fcd34d" opacity="0.88"/>
  <circle cx="638" cy="325" r="28" fill="none" stroke="#fbbf24"
    stroke-width="1.4" stroke-dasharray="5 5" opacity="0.65"/>
</g>
<text x="638" y="318" text-anchor="middle" font-size="14">✨</text>
<text x="638" y="372" text-anchor="middle" font-size="11.5"
  fill="#fbbf24" font-weight="700" font-family="Georgia,serif">New Role</text>
<text x="638" y="387" text-anchor="middle" font-size="8"
  fill="#fcd34d" font-style="italic">just discovered by SAGE</text>


<!-- ═══════════════════════════════════
     PARTICLES
     purple = SAGE pushing out to agents
     teal   = agents teaching SAGE back
═══════════════════════════════════ -->
<!-- Outward: SAGE → agents -->
<circle r="3" fill="#a78bfa" opacity="0.95">
  <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion>
</circle>
<circle r="3" fill="#a78bfa" opacity="0.95">
  <animateMotion dur="3.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion>
</circle>
<circle r="3" fill="#a78bfa" opacity="0.95">
  <animateMotion dur="4.0s" begin="1.0s" repeatCount="indefinite"><mpath href="#pc"/></animateMotion>
</circle>
<!-- second wave -->
<circle r="2" fill="#a78bfa" opacity="0.55">
  <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion>
</circle>
<circle r="2" fill="#a78bfa" opacity="0.55">
  <animateMotion dur="3.6s" begin="2.2s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion>
</circle>

<!-- Inward: agents → SAGE (teal, reverse) -->
<circle r="2.6" fill="#5eead4" opacity="0.9">
  <animateMotion dur="3.5s" begin="1.2s" repeatCount="indefinite"
    keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pa"/></animateMotion>
</circle>
<circle r="2.6" fill="#5eead4" opacity="0.9">
  <animateMotion dur="4.0s" begin="0.8s" repeatCount="indefinite"
    keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pb"/></animateMotion>
</circle>
<circle r="2.6" fill="#5eead4" opacity="0.9">
  <animateMotion dur="4.2s" begin="2.0s" repeatCount="indefinite"
    keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pc"/></animateMotion>
</circle>
<!-- second wave -->
<circle r="1.8" fill="#5eead4" opacity="0.5">
  <animateMotion dur="3.5s" begin="3.0s" repeatCount="indefinite"
    keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pa"/></animateMotion>
</circle>
<circle r="1.8" fill="#5eead4" opacity="0.5">
  <animateMotion dur="4.2s" begin="3.6s" repeatCount="indefinite"
    keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pc"/></animateMotion>
</circle>


<!-- ═══════════════════════════════════
     SOIL LABELS  (company's world)
═══════════════════════════════════ -->
<text x="450" y="494" text-anchor="middle"
  font-size="15" fill="#fcd34d" font-weight="700"
  font-family="Georgia, serif" opacity="0.92"
  filter="url(#fSoilText)">The Ask · The Goal · The Company</text>
<text x="450" y="514" text-anchor="middle"
  font-size="9.5" fill="#f59e0b" font-style="italic" opacity="0.62">
  SAGE grows from here — and its roots run deep into your world
</text>

<!-- small icons in soil -->
<text x="220" y="444" font-size="12" opacity="0.45">📄</text>
<text x="262" y="442" font-size="11" opacity="0.35">💬</text>
<text x="630" y="444" font-size="12" opacity="0.45">📊</text>
<text x="672" y="442" font-size="11" opacity="0.35">📋</text>

<!-- ═══════════════════════════════════
     LEGEND + TITLE
═══════════════════════════════════ -->
<g opacity="0.58">
  <circle cx="30" cy="30" r="3.5" fill="#a78bfa"/>
  <text x="40" y="34" font-size="9" fill="#a78bfa" font-style="italic" font-family="Georgia,serif">SAGE grows new agents</text>
  <circle cx="30" cy="50" r="3.5" fill="#5eead4"/>
  <text x="40" y="54" font-size="9" fill="#5eead4" font-style="italic" font-family="Georgia,serif">Agents teach SAGE back</text>
</g>

<text x="450" y="18" text-anchor="middle" font-size="10" fill="#4c1d95"
  letter-spacing="4" opacity="0.45" font-family="Georgia, serif">
  SELF-ARCHITECTING GENESIS ENGINE
</text>

</svg>
</body>
</html>
